<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group 4 — Interdisciplinary Performance Task</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="envelope-page">
    <span class="envelope-eyebrow">Group 4 · Interdisciplinary Performance Task</span>

    <div class="envelope-scene" id="scene">
      <a class="envelope-link" href="#scene" aria-label="Open the envelope">
        <div class="envelope">
          <div class="envelope-body"></div>
          <div class="envelope-flap"></div>
        </div>
      </a>

      <a class="envelope-letter-link" href="letter.html" aria-label="Read the letter">
        <div class="envelope-letter">
          <span>To the teacher that is reading this, here are the members that form group 4, and for your information, all of us contributed well. </span>
        </div>
      </a>

      <div class="envelope-photos" aria-hidden="true">
        <div class="envelope-photo photo-1"><img src="mark.jpg" alt="" onerror="this.style.display='none'" /></div>
        <div class="envelope-photo photo-2"><img src="erica.jpg" alt="" onerror="this.style.display='none'" /></div>
        <div class="envelope-photo photo-3"><img src="vince.jpg" alt="" onerror="this.style.display='none'" /></div>
        <div class="envelope-photo photo-4"><img src="jd.jpg" alt="" onerror="this.style.display='none'" /></div>
        <div class="envelope-photo photo-5"><img src="feli.jpg" alt="" onerror="this.style.display='none'" /></div>
        <div class="envelope-photo photo-6"><img src="sama.jpg" alt="" onerror="this.style.display='none'" /></div>
        <div class="envelope-photo photo-7"><img src="ash.jpg" alt="" onerror="this.style.display='none'" /></div>
      </div>

      <p class="envelope-hint">Click and <span class="tap">open it</span></p>
      <p class="envelope-hint-opened">Click the letter <span class="tap">again</span> to read it</p>
    </div>
  </div>
</body>
</html>
